name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run QA against the demo site
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: reports/
          retention-days: 7
