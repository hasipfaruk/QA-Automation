<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Proofline</title>
  <meta name="theme-color" content="#08090c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="error-page">
    <div class="error-page__inner">
      <span class="error-page__code gradient-text">404</span>
      <h1>This page could not be found</h1>
      <p class="muted">The link may be broken, or the page may have been moved, removed or expired.</p>
      <div class="error-page__actions">
        <a class="btn btn--primary" href="/app">Go to dashboard</a>
        <a class="btn" href="/">Back to home</a>
      </div>
    </div>
  </main>
</body>
</html>
