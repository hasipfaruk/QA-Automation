<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proofline</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app/main.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="shell__scrim" aria-hidden="true"></div>
    <div class="shell__main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main">
        <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span> Loading</div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <noscript><p class="content">Proofline requires JavaScript.</p></noscript>
</body>
</html>
